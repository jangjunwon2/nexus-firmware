name: ESP32 Firmware Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.c"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: nexus_flux_case/nexus_flux_case.ino
            device: nexus_flux_case
          - sketch: nexus_pot/nexus_pot.ino
            device: nexus_pot
          - sketch: nexus_receiver/nexus_receiver.ino
            device: nexus_receiver
          - sketch: nexus_smoke/nexus_smoke.ino
            device: nexus_smoke
          - sketch: nexus_transmitter/nexus_transmitter.ino
            device: nexus_transmitter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          # Arduino Library Manager 등록 라이브러리
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

          # ESPAsyncWebServer (Library Manager 미등록 → GitHub에서 직접 설치)
          git clone --depth 1 https://github.com/me-no-dev/AsyncTCP \
            ~/Arduino/libraries/AsyncTCP
          git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer \
            ~/Arduino/libraries/ESPAsyncWebServer

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            ${{ matrix.sketch }} \
            --output-dir ./build

      - name: Get signed upload URL
        id: get-url
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          SHORT="${GITHUB_SHA:0:8}"
          FILENAME="firmware-${SHORT}.bin"

          RESPONSE=$(curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware/upload-url \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"device_type\":\"${{ matrix.device }}\",\"version\":\"${SHORT}\",\"filename\":\"${FILENAME}\"}")

          echo "signed_url=$(echo "$RESPONSE" | jq -r '.signedUrl')" >> "$GITHUB_OUTPUT"
          echo "storage_path=$(echo "$RESPONSE" | jq -r '.storagePath')" >> "$GITHUB_OUTPUT"
          echo "public_url=$(echo "$RESPONSE" | jq -r '.publicUrl')" >> "$GITHUB_OUTPUT"
          echo "version=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload binary to Supabase Storage
        run: |
          BIN=$(find ./build -name "*.bin" | head -1)
          echo "업로드 파일: $BIN ($(stat -c%s "$BIN") bytes)"
          curl -sf -X PUT "${{ steps.get-url.outputs.signed_url }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${BIN}"

      - name: Register release in admin
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          BIN=$(find ./build -name "*.bin" | head -1)
          FILE_SIZE=$(stat -c%s "$BIN")
          SHORT="${GITHUB_SHA:0:8}"
          MSG="${{ github.event.head_commit.message }}"

          curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"device_type\": \"${{ matrix.device }}\",
              \"version\": \"${{ steps.get-url.outputs.version }}\",
              \"download_url\": \"${{ steps.get-url.outputs.public_url }}\",
              \"storage_path\": \"${{ steps.get-url.outputs.storage_path }}\",
              \"file_size\": ${FILE_SIZE},
              \"notes\": \"${SHORT}: ${MSG}\"
            }"

          echo "✅ ${{ matrix.device }} v${{ steps.get-url.outputs.version }} 배포 완료"
