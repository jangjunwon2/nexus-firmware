name: ESP32 Firmware Build & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      device:
        description: '빌드할 장치 이름 (비워두면 전체 빌드)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.c"
      - "**/.build"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEVICE_INPUT="${{ github.event.inputs.device }}"
            if [ -n "$DEVICE_INPUT" ]; then
              DEVICES=$(jq -nc --arg d "$DEVICE_INPUT" '[$d]')
            else
              DEVICES=$(find . -name "*.ino" -not -path "*/.git/*" \
                | xargs -I{} dirname {} \
                | sed 's|^\./||' \
                | sort -u \
                | jq -Rc . | jq -sc .)
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_DIRS=$(find . -name "*.ino" -not -path "*/.git/*" \
                | xargs -I{} dirname {} | sed 's|^\./||' | sort -u)
            else
              CHANGED_DIRS=$(git diff --name-only "$BEFORE" HEAD \
                | grep -v '^\.github/' \
                | sed 's|/.*||' \
                | sort -u)
            fi

            DEVICES="[]"
            for DIR in $CHANGED_DIRS; do
              if [ -d "./$DIR" ] && find "./$DIR" -name "*.ino" | grep -q .; then
                DEVICES=$(echo "$DEVICES" | jq -c --arg d "$DIR" '. + [$d]')
              fi
            done
          fi

          echo "matrix=$DEVICES" >> $GITHUB_OUTPUT
          echo "빌드 대상: $DEVICES"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: firmware-build-${{ matrix.device }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-libs-${{ runner.os }}-v1
          restore-keys: |
            arduino-esp32-libs-${{ runner.os }}-

      - name: Extract version
        id: ver
        run: |
          DEVICE_DIR="${{ matrix.device }}"

          VERSION=""
          for CFG in "${DEVICE_DIR}/config.h" "${DEVICE_DIR}/config_t.h"; do
            if [ -f "$CFG" ]; then
              V=$(grep -oP '(?:#define\s+FIRMWARE_VERSION\s+"|constexpr\s+const\s+char\s*\*\s*FIRMWARE_VERSION\s*=\s*")\K[^"]+' "$CFG" || true)
              if [ -n "$V" ]; then VERSION="$V"; break; fi
            fi
          done

          if [ -z "$VERSION" ]; then
            echo "::error::버전을 감지하지 못했습니다. ${DEVICE_DIR}/config.h 또는 config_t.h에 FIRMWARE_VERSION을 정의하세요."
            exit 1
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if echo "$MAJOR" | grep -qE '^[0-9]+$' && echo "$MINOR" | grep -qE '^[0-9]+$'; then
            VERSION="${MAJOR}.${MINOR}"
          fi

          echo "감지된 버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "U8g2"                 # <--- 추가
          arduino-cli lib install "U8g2_for_Adafruit_GFX" # <--- 추가
          if [ ! -d ~/Arduino/libraries/AsyncTCP ]; then
            git clone --depth 1 https://github.com/me-no-dev/AsyncTCP ~/Arduino/libraries/AsyncTCP
          fi
          if [ ! -d ~/Arduino/libraries/ESPAsyncWebServer ]; then
            git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer ~/Arduino/libraries/ESPAsyncWebServer
          fi


      - name: Compile
        run: |
          mkdir -p build
          INO_COUNT=$(find ./${{ matrix.device }} -name "*.ino" | wc -l)
          if [ "$INO_COUNT" -eq "0" ]; then
            echo "::error::.ino 파일을 찾을 수 없습니다: ${{ matrix.device }}"
            exit 1
          fi
          if [ "$INO_COUNT" -gt "1" ]; then
            echo "::warning::.ino 파일이 여러 개 감지됐습니다. 첫 번째 파일을 사용합니다:"
            find ./${{ matrix.device }} -name "*.ino"
          fi
          SKETCH=$(find ./${{ matrix.device }} -name "*.ino" | head -1)
          echo "빌드: $SKETCH (v${{ steps.ver.outputs.version }})"
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=min_spiffs" \
            "$SKETCH" \
            --output-dir ./build
          BIN_CHECK=$(find ./build -name "*.ino.bin" | head -1)
          if [ -z "$BIN_CHECK" ]; then
            echo "::error::컴파일 후 바이너리(.ino.bin)를 찾을 수 없습니다."
            exit 1
          fi

      - name: Upload binary to Supabase Storage
        id: upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BIN=$(find ./build -name "*.ino.bin" | head -1)
          FILE_SIZE=$(stat -c%s "$BIN")
          STORAGE_PATH="${{ matrix.device }}/${VERSION}/firmware-v${VERSION}.bin"
          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/firmware/${STORAGE_PATH}"

          echo "업로드: $STORAGE_PATH (${FILE_SIZE} bytes)"
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/firmware/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @"${BIN}")
          echo "HTTP 상태: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -ge 400 ]; then
            echo "응답: $(cat /tmp/upload_response.txt)"
            exit 1
          fi

          echo "storage_path=${STORAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Register release in database
        id: register
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
          DOWNLOAD_URL: ${{ steps.upload.outputs.public_url }}
          STORAGE_PATH: ${{ steps.upload.outputs.storage_path }}
          FILE_SIZE: ${{ steps.upload.outputs.file_size }}
        run: |
          DEVICE="${{ matrix.device }}"

          PAYLOAD=$(jq -n \
            --arg url "$DOWNLOAD_URL" \
            --arg sp  "$STORAGE_PATH" \
            --argjson fs "${FILE_SIZE:-0}" \
            '{download_url:$url,storage_path:$sp,file_size:$fs}')

          RESPONSE=$(curl -s -X PATCH \
            "${SUPABASE_URL}/rest/v1/firmware_releases?device_type=eq.${DEVICE}&version=eq.${VERSION}&download_url=eq." \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD")

          UPDATED=$(echo "$RESPONSE" | jq 'if type == "array" then length else 0 end' 2>/dev/null || echo "0")
          if [ "$UPDATED" -eq "0" ]; then
            echo "::error::${DEVICE} v${VERSION}: pending 행 없음 — 소스 업로드 없이 재빌드됐거나 버전 불일치"
            echo "registered=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ ${DEVICE} v${VERSION} 완료"
          echo "registered=true" >> "$GITHUB_OUTPUT"

      - name: Delete old releases
        if: steps.register.outputs.registered == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          DEVICE="${{ matrix.device }}"

          OLD=$(curl -s \
            "${SUPABASE_URL}/rest/v1/firmware_releases?device_type=eq.${DEVICE}&version=neq.${VERSION}&download_url=neq.&select=id,storage_path" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}")

          COUNT=$(echo "$OLD" | jq 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -eq "0" ]; then
            echo "삭제할 이전 버전 없음"
            exit 0
          fi

          PREFIXES=$(echo "$OLD" | jq '[.[].storage_path]')
          STORAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/firmware" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"prefixes\": ${PREFIXES}}")
          if [ "$STORAGE_STATUS" -ge 400 ]; then
            echo "::warning::구 버전 스토리지 파일 삭제 실패 (HTTP ${STORAGE_STATUS}) — DB 레코드는 계속 삭제합니다."
          fi

          IDS=$(echo "$OLD" | jq -r '[.[].id] | join(",")')
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "${SUPABASE_URL}/rest/v1/firmware_releases?id=in.(${IDS})" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}")
          if [ "$DB_STATUS" -ge 400 ]; then
            echo "::warning::구 버전 DB 레코드 삭제 실패 (HTTP ${DB_STATUS})"
          else
            echo "🗑️ 이전 버전 ${COUNT}개 삭제 완료"
          fi
