name: ESP32 Firmware Build & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.c"
      - "**/version.txt"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 수동 실행: 모든 장치 빌드
            DEVICES=$(find . -name "*.ino" -not -path "*/.git/*" \
              | xargs -I{} dirname {} \
              | sed 's|^\./||' \
              | sort -u \
              | jq -Rc . | jq -sc .)
          else
            # push 이벤트: 변경된 장치 폴더만 빌드
            CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD \
              | grep -v '^\.github/' \
              | sed 's|/.*||' \
              | sort -u)

            DEVICES="[]"
            for DIR in $CHANGED_DIRS; do
              if [ -d "./$DIR" ] && find "./$DIR" -name "*.ino" | grep -q .; then
                DEVICES=$(echo "$DEVICES" | jq -c --arg d "$DIR" '. + [$d]')
              fi
            done
          fi

          echo "matrix=$DEVICES" >> $GITHUB_OUTPUT
          echo "빌드 대상: $DEVICES"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [ -f "./${{ matrix.device }}/version.txt" ]; then
            VERSION=$(cat "./${{ matrix.device }}/version.txt" | tr -d '[:space:]')
          else
            VERSION=$(cat "./version.txt" | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "${{ matrix.device }} 버전: $VERSION"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          git clone --depth 1 https://github.com/me-no-dev/AsyncTCP \
            ~/Arduino/libraries/AsyncTCP
          git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer \
            ~/Arduino/libraries/ESPAsyncWebServer

      - name: Compile
        run: |
          SKETCH=$(find ./${{ matrix.device }} -name "*.ino" | head -1)
          echo "빌드: $SKETCH (v${{ steps.ver.outputs.version }})"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            "$SKETCH" \
            --output-dir ./build

      - name: Upload binary to Supabase Storage
        id: upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BIN=$(find ./build -name "*.ino.bin" | head -1)
          FILE_SIZE=$(stat -c%s "$BIN")
          STORAGE_PATH="${{ matrix.device }}/${VERSION}/firmware-v${VERSION}.bin"
          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/firmware/${STORAGE_PATH}"

          echo "업로드: $STORAGE_PATH (${FILE_SIZE} bytes)"
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/firmware/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @"${BIN}")
          echo "HTTP 상태: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -ge 400 ]; then
            echo "응답: $(cat /tmp/upload_response.txt)"
            exit 1
          fi

          echo "storage_path=${STORAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Register release in database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MSG="${{ github.event.head_commit.message }}"
          curl -sf -X POST \
            "${SUPABASE_URL}/rest/v1/firmware_releases" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"device_type\": \"${{ matrix.device }}\",
              \"version\": \"${VERSION}\",
              \"download_url\": \"${{ steps.upload.outputs.public_url }}\",
              \"storage_path\": \"${{ steps.upload.outputs.storage_path }}\",
              \"file_size\": ${{ steps.upload.outputs.file_size }},
              \"is_active\": true,
              \"notes\": \"v${VERSION}: ${MSG}\"
            }"
          echo "✅ ${{ matrix.device }} v${VERSION} 완료"

      - name: Delete old releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          OLD=$(curl -s \
            "${SUPABASE_URL}/rest/v1/firmware_releases?device_type=eq.${{ matrix.device }}&version=neq.${VERSION}&select=id,storage_path" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}")

          COUNT=$(echo "$OLD" | jq 'length')
          if [ "$COUNT" -eq "0" ]; then
            echo "삭제할 이전 버전 없음"
            exit 0
          fi

          PREFIXES=$(echo "$OLD" | jq '[.[].storage_path]')
          curl -s -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/firmware" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"prefixes\": ${PREFIXES}}"

          IDS=$(echo "$OLD" | jq -r '[.[].id] | join(",")')
          curl -s -X DELETE \
            "${SUPABASE_URL}/rest/v1/firmware_releases?id=in.(${IDS})" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}"

          echo "🗑️ 이전 버전 ${COUNT}개 삭제 완료"
